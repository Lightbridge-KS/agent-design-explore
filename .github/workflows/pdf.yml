name: Build website and PDF

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PDF_MERMAID_THEME: neutral

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website and PDF
        run: pnpm build:deploy

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: agent-design-explore-pdf
          path: dist/downloads/agent-design-explore.pdf
          if-no-files-found: error
          retention-days: 14
